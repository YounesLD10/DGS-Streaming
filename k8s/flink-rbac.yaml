# ServiceAccount is created by terraform/flink.tf.
# This manifest adds the ClusterRoleBinding so Flink jobs can interact
# with the Kubernetes API (e.g., for HA, checkpoints, job discovery).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-role-binding
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
